<!-- inventory/templates/inventory/add_credit.html -->
{% extends 'base.html' %}
{% load crispy_forms_tags %}

{% block title %}Add Credit - KGL{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow">
            <div class="card-body">
                <h2 class="card-title mb-4">Record New Credit</h2>
                <form method="post">
                    {% csrf_token %}
                    {{ form|crispy }}
                    <div class="mt-4">
                        <button type="submit" class="btn btn-primary">Save Credit</button>
                        <a href="{% url 'all_credits' %}" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
